[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ulidlib"
version = "0.1.0"
description = "ULID generator for the art recognition engine"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]